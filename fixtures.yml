
name: AfrilKick Fixture Import

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  fetch-fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch football fixtures
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node automation/fetch-fixtures.js
